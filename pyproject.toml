[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scolta"
version = "1.0.0"
description = "AI-powered search with Pagefind — Python language binding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tag1 Consulting", email = "info@tag1.com" }]
keywords = ["search", "ai", "pagefind", "wasm", "scoring"]

# Runtime dependencies. Heavy/native packages that need system headers
# (PyICU) are optional extras, mirroring scolta-php where ext-intl is a
# "suggest" with a pure-PHP strtr() fallback — not a hard requirement.
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    # Must stay on the modern (Snowball >=3.0, 2024-revised) English algorithm:
    # Pagefind 1.5.0 stems queries at runtime with pagefind_stem 1.0.0 (published
    # 2026-03-23, post-Snowball-3.0), which emits the revised stems (added->add,
    # organic->organic, geologist->geolog, organize->organiz). snowballstemmer 3.x
    # reproduces that crate's output byte-for-byte over the full corpus; the
    # pre-3.0 2.x line diverges (added->ad, ...) and would silently miss those
    # queries against a 1.5.0 index. The >=3 floor enforces it; the stemmer
    # parity tests guard it. See tests/fixtures/stemmer-corpus/PROVENANCE.md.
    "snowballstemmer>=3",
    "regex>=2024.0",
    "msgpack>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Improves Unicode diacritic normalization quality (Pagefind splitting.rs
# parity). Without it, tokenizer falls back to a strtr()-style mapping,
# exactly as the PHP binding does without ext-intl.
icu = ["PyICU>=2.12"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-playwright>=0.5",  # browser E2E (run: playwright install chromium)
]

[tool.hatch.build.targets.wheel]
packages = ["src/scolta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running benchmark/scale tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
