[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scolta"
dynamic = ["version"]
description = "AI-powered search with Pagefind — Python language binding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tag1 Consulting", email = "info@tag1.com" }]
keywords = ["search", "ai", "pagefind", "wasm", "scoring"]

# Runtime dependencies. Heavy/native packages that need system headers
# (PyICU) are optional extras, mirroring scolta-php where ext-intl is a
# "suggest" with a pure-PHP strtr() fallback — not a hard requirement.
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    # Must stay on the modern (Snowball >=3.0, 2024-revised) English algorithm:
    # Pagefind 1.5.0 stems queries at runtime with pagefind_stem 1.0.0 (published
    # 2026-03-23, post-Snowball-3.0), which emits the revised stems (added->add,
    # organic->organic, geologist->geolog, organize->organiz). snowballstemmer 3.x
    # reproduces that crate's output byte-for-byte over the full corpus; the
    # pre-3.0 2.x line diverges (added->ad, ...) and would silently miss those
    # queries against a 1.5.0 index. The >=3 floor enforces it; the stemmer
    # parity tests guard it. See tests/fixtures/stemmer-corpus/PROVENANCE.md.
    "snowballstemmer>=3",
    "regex>=2024.0",
    "msgpack>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Improves Unicode diacritic normalization quality (Pagefind splitting.rs
# parity). Without it, tokenizer falls back to a strtr()-style mapping,
# exactly as the PHP binding does without ext-intl.
icu = ["PyICU>=2.12"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-playwright>=0.5",  # browser E2E (run: playwright install chromium)
]

# Single-source the version from __init__.py so the package metadata and
# scolta.__version__ can never drift again.
[tool.hatch.version]
path = "src/scolta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scolta"]

# The sdist must carry the buildable source set (src/, tests/, docs/, the parity
# harnesses and the stemmer-golden tool source) but NOT the local-only build
# directories that live untracked inside them. Hatchling's sdist defaults to
# "everything on disk except VCS-ignored", but it does NOT prune nested,
# separately-managed trees like tests/js/node_modules (61 MB of vendored npm
# packages, including .idea IDE files) or tools/stemmer-golden/target (1.5 MB of
# Rust build artifacts) reliably across environments — so we enumerate the
# excludes explicitly here, fail-closed. If the sdist ever bloats again, this
# is the filter to fix. scripts/validate-dist.py asserts the result.
[tool.hatch.build.targets.sdist]
exclude = [
  "**/node_modules",
  "tools/**/target",
  "**/__pycache__",
  "**/*.pyc",
  ".pytest_cache",
  ".ruff_cache",
  "**/.idea",
  "**/.vscode",
  ".venv",
  "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running benchmark/scale tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
# line-length is enforced for code by `ruff format` (CI runs --check). E501
# stays off because the remaining over-length lines are single-line string
# literals (AI prompt templates, error messages) that are parity-sensitive
# with scolta-php and deliberately not wrapped.
ignore = ["E501"]
