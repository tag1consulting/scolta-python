name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check src tests

      # The browser E2E proves the shared Pagefind WASM accepts a Python-built
      # index. It auto-skips when Chromium is absent; install it so it runs.
      - name: Install Chromium for the browser E2E
        run: uv run playwright install --with-deps chromium

      - name: Test (pytest)
        run: uv run pytest -q

  js-tests:
    name: JS tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        working-directory: tests/js
        run: npm ci

      - name: Run Jest tests
        working-directory: tests/js
        run: npm test
