name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      # The browser E2E proves the shared Pagefind WASM accepts a Python-built
      # index. It auto-skips when Chromium is absent; install it so it runs.
      - name: Install Chromium for the browser E2E
        run: uv run playwright install --with-deps chromium

      - name: Test (pytest)
        run: uv run pytest -q

  dist:
    name: Build & validate dist artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # Build the sdist and wheel exactly as a release would. This is the only
      # CI path that exercises packaging, so cruft or a missing-asset build
      # surfaces here, in PR, instead of at the manual `twine upload`.
      - name: Build sdist + wheel
        run: uv build

      # Long-description / metadata validity (the PyPI render gate).
      - name: twine check
        run: uvx twine check dist/*

      # Content + size asserts: vendored runtime assets present, no tests/cache/
      # cruft in the wheel, no node_modules/cargo-target/junk in the sdist, both
      # under their size caps. Same script that runs locally after `uv build`.
      - name: Validate dist contents
        run: uv run python scripts/validate-dist.py

  js-tests:
    name: JS tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        working-directory: tests/js
        run: npm ci

      - name: Run Jest tests
        working-directory: tests/js
        run: npm test
